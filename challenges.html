<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Challenges — Python GCSE Challenge Lab</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="challenges">
<header id="site-header" class="site-header"></header>

<main class="page page-wide">
  <h1 class="eyebrow-free-title">Challenges</h1>
  <p class="page-lede">Filter by level, topic or status, or search by name. Select a challenge to open its workbench.</p>

  <div class="filter-bar">
    <input type="search" id="search-input" placeholder="Search challenge names…" />
    <div class="filter-group">
      <label for="level-select">Level</label>
      <select id="level-select"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label for="topic-select">Topic</label>
      <select id="topic-select"><option value="">All</option></select>
    </div>
    <div class="filter-group">
      <label for="status-select">Status</label>
      <select id="status-select">
        <option value="">All</option>
        <option value="not-started">Not Started</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <span id="filter-count" class="filter-count"></span>
  </div>

  <div id="challenge-grid" class="challenge-grid"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/challenges.js"></script>
<script src="js/app.js"></script>
</body>
</html>
