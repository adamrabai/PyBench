<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GCSE Topics — PyBench</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="topics">
<header id="site-header" class="site-header"></header>

<main class="page">
  <h1 class="eyebrow-free-title">GCSE Topics</h1>
  <p class="page-lede">Browse challenges by the programming concept they exercise. Selecting a topic takes you to the filtered challenge list.</p>

  <div id="topic-grid" class="topic-grid"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/challenges.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const data = ProgressStore.all();
    const completedIds = new Set(Object.keys(data.completed).map(Number));

    const grid = document.getElementById("topic-grid");
    grid.innerHTML = TOPICS.map(topic => {
      const related = CHALLENGES.filter(c => c.topics.includes(topic));
      const done = related.filter(c => completedIds.has(c.id)).length;
      const pct = related.length ? Math.round((done / related.length) * 100) : 0;
      return `
        <a class="topic-card" href="challenges.html?topic=${encodeURIComponent(topic)}" style="text-decoration:none;color:inherit;">
          <h3>${topic}</h3>
          <div class="topic-count">${related.length} challenge${related.length === 1 ? "" : "s"}</div>
          <div class="topic-progress-track"><div class="topic-progress-fill" style="width:${pct}%;"></div></div>
          <div class="text-faint" style="font-size:11.5px;">${done} / ${related.length} completed</div>
        </a>
      `;
    }).join("");
  });
</script>
</body>
</html>
